# Based on https://github.com/wordpress/wp-plugin-dependencies
name: CI

on:
  push:
    branches: [ main ]
    # A change to the translation template only (the Generate POT PR) needs no tests.
    paths-ignore:
      - 'languages/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'languages/**'

# Every job only reads the repository (Codecov uses its own token secret).
permissions:
  contents: read

jobs:
  phpcs:
    runs-on: ubuntu-latest
    env:
      TRAVIS_BUILD_DIR: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        # Lowest supported, 62wp's, and the newest.
        php_version: [ '8.0', '8.3', '8.4', '8.5' ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli
          coverage: none

      # No composer.lock (gitignored), so key the cache on composer.json.
      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php_version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php_version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: phpcs
        run: script/cibuild-phpcs

  phpunit:
    name: phpunit (PHP ${{ matrix.php_version }}${{ matrix.multisite && ', multisite' || '' }}${{ matrix.coverage && ', coverage' || '' }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
    strategy:
      fail-fast: false
      matrix:
        php_version: [ '8.0', '8.3', '8.4', '8.5' ]
        multisite: [ false ]
        coverage: [ false ]
        include:
          # One multisite run (class-test-wpdr-en-multisite.php is skipped on single site).
          - php_version: '8.4'
            multisite: true
            coverage: false
          # Coverage for Codecov from one single-site run.
          - php_version: '8.4'
            multisite: false
            coverage: true
        exclude:
          # The coverage run above replaces the plain 8.4 run.
          - php_version: '8.4'
            multisite: false
            coverage: false
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
      # The required parent plugin; tests/bootstrap.php loads it from here.
      WPDR_PLUGIN_DIR: /tmp/wp-document-revisions
      WP_MULTISITE: ${{ matrix.multisite && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php_version }}
          extensions: mysqli
          coverage: ${{ matrix.coverage && 'pcov' || 'none' }}
          # PCOV only records files under pcov.directory. Left unset it picks ./src when that exists,
          # and our src/ holds only JS and CSS, so point it at the whole plugin.
          ini-values: ${{ matrix.coverage && format('pcov.directory={0}', github.workspace) || '' }}

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php_version }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php_version }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Get WP Document Revisions (latest release)
        run: |
          curl -sSL -o /tmp/wpdr.zip https://downloads.wordpress.org/plugin/wp-document-revisions.latest-stable.zip
          unzip -q /tmp/wpdr.zip -d /tmp

      - name: Install WordPress and the test library
        run: bash script/install-wp-tests wordpress_test root root 127.0.0.1:3306 latest

      - name: phpunit
        if: ${{ ! matrix.coverage }}
        run: sh script/cibuild-phpunit

      - name: phpunit with coverage
        if: ${{ matrix.coverage }}
        run: sh script/cibuild-phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

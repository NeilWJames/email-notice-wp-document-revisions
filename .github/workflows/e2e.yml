# End-to-end (browser) tests with Playwright against a wp-env WordPress (Docker runtime, MySQL),
# with WP Document Revisions from wordpress.org and this plugin from the checkout.
# Locally the same tests run against the Playground runtime: see tests/test_suite.md, "End-to-end tests".
name: E2E email-notice-wp-document-revisions

on:
  push:
    branches:
      - main
    # A change to the translation template only (the Generate POT PR) needs no tests.
    paths-ignore:
      - 'languages/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'languages/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # No build step: the tests use build/ as committed, which is what is released.
      - name: Install
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Start WordPress before the tests: wp-env answers on the site URL before it has
      # activated the plugins, so a start by Playwright's webServer let the first test run too early.
      - name: Start WordPress (wp-env)
        run: npx @wordpress/env start

      # playwright.config.js finds the running site (reuseExistingServer).
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
